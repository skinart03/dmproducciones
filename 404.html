<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada — DM Producciones</title>
<meta name="description" content="La página que buscás no existe. Volvé al inicio de DM Producciones.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/uploads/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04030a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;position:relative;overflow:hidden;text-align:center;}
  .blob{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none;}
  .blob.b1{width:520px;height:520px;background:#FFB800;top:-180px;left:-160px;opacity:.18}
  .blob.b2{width:560px;height:560px;background:#7a3cff;bottom:-200px;right:-180px;opacity:.14}
  .logo{position:relative;z-index:1;width:auto;height:auto;max-width:240px;max-height:140px;margin-bottom:36px;display:block;object-fit:contain;}
  .code{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:clamp(96px,18vw,180px);line-height:1;letter-spacing:.02em;background:linear-gradient(180deg,#fff 0%,#cfc7a8 60%,#FFB800 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:1;}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:clamp(32px,5vw,52px);margin:8px 0 14px;position:relative;z-index:1;}
  p{color:#cdc8e0;font-size:clamp(15px,1.6vw,18px);max-width:520px;margin:0 auto 32px;line-height:1.55;position:relative;z-index:1;}
  .cta{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;border-radius:999px;background:linear-gradient(180deg,#FFB800,#e09a00);color:#1a1305;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px;text-decoration:none;box-shadow:0 18px 36px -10px rgba(255,184,0,.55);transition:.25s ease;position:relative;z-index:1;}
  .cta:hover{transform:translateY(-3px);box-shadow:0 24px 46px -10px rgba(255,184,0,.7);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <img class="logo" src="/uploads/dm-logo.png" alt="DM Producciones">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscás no existe o fue movida. Volvé al inicio y explorá lo que hacemos.</p>
    <a class="cta" href="/">Volver al inicio →</a>
  </div>
</body>
</html>
